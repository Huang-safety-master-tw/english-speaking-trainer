<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>English Speaking Trainer</title><style>
:root{--navy:#11243d;--blue:#1767d2;--amber:#f5b841;--bg:#f4f7fb;--line:#dce3ec;--muted:#68778b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--navy);font-family:Inter,"Noto Sans TC",Arial,sans-serif}button,select,textarea{font:inherit}button{cursor:pointer}.wrap{max-width:1040px;margin:auto;padding:0 20px}header{position:sticky;top:0;z-index:9;background:#fffc;border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}header .wrap{display:flex;align-items:center;justify-content:space-between;padding-top:14px;padding-bottom:14px}.eyebrow{font-size:10px;font-weight:900;letter-spacing:.22em;text-transform:uppercase;color:var(--blue)}h1{font-size:21px;margin:4px 0 0}.switch{display:flex;background:#eef2f7;border-radius:999px;padding:4px}.switch button{border:0;background:transparent;padding:9px 14px;border-radius:999px;font-size:12px;font-weight:900;color:var(--muted)}.switch .on{background:#fff;color:var(--blue);box-shadow:0 2px 8px #1232}.hero{margin-top:28px;padding:28px;border-radius:28px;background:var(--navy);color:#fff;box-shadow:0 20px 50px #11243d2e}.hero small{color:#bdd7ff;font-weight:800}.hero h2{font-size:32px;line-height:1.08;margin:10px 0}.hero p{color:#c8d0dc;margin:0}.filters{display:flex;gap:8px;overflow:auto;margin-top:24px;padding-bottom:4px}.chip{white-space:nowrap;border:1px solid var(--line);background:#fff;color:#5d6b7e;border-radius:999px;padding:9px 14px;font-size:13px;font-weight:800}.chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}select{margin-top:10px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:9px}.section-head{margin:26px 0 14px}.section-head h2{margin:4px 0;font-size:22px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px;padding-bottom:70px}.card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:0 8px 30px #11243d0f}.card.retry{border-color:var(--amber)}.retry-tag{display:inline-block;border-radius:99px;background:#fff0c8;color:#855800;padding:6px 10px;font-size:11px;font-weight:900}.topic{margin:12px 0 0;color:var(--blue);font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.12em}.question{min-height:52px;margin:8px 0;font-size:18px;line-height:1.35}.meta{display:flex;justify-content:space-between;gap:6px;margin-top:16px;color:var(--muted);font-size:11px;font-weight:700}.bars{display:flex;gap:5px;margin-top:10px}.bars i{height:6px;flex:1;border-radius:9px;background:#dfe5ed}.bars i.fill{background:var(--blue)}.primary{width:100%;min-height:49px;margin-top:17px;border:0;border-radius:15px;background:var(--navy);color:#fff;font-weight:900}.back{border:0;background:transparent;color:var(--blue);font-weight:900;padding:20px 0}.practice-title{font-size:30px;line-height:1.18;margin:10px 0 22px}.recorder{border-radius:28px;background:var(--navy);color:#fff;padding:26px;text-align:center}.mic{display:grid;place-items:center;width:112px;height:112px;margin:auto;border-radius:50%;background:var(--blue);font-size:40px}.mic.live{background:#dc3545;animation:pulse 1.2s infinite}.timer{font:700 27px monospace;margin:15px 0 3px}.record-btn{width:100%;min-height:54px;margin-top:16px;border:0;border-radius:16px;background:var(--amber);color:var(--navy);font-weight:900}.record-btn.stop{background:#fff;color:#d22}.panel{margin-top:16px;padding:20px;border:1px solid var(--line);border-radius:24px;background:#fff}.rating{margin-bottom:22px}.rating h3{font-size:14px}.options{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:7px}.options button{min-height:55px;padding:5px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--muted);font-size:11px;font-weight:800}.options button.on{border-color:var(--blue);background:#eef5ff;color:var(--blue)}.options b{display:block;font-size:16px}.attempt{margin-top:12px;padding:18px;border:1px solid var(--line);border-radius:20px;background:#fff}.attempt-top{display:flex;justify-content:space-between}.pill{border-radius:99px;background:#eef5ff;color:var(--blue);padding:5px 9px;font-size:11px;font-weight:900}audio{width:100%;margin-top:13px}.feedback{margin-top:12px;padding:13px;border-radius:14px;background:#fff5da;font-size:13px}.teacher-form{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}textarea{width:100%;min-height:82px;border:1px solid var(--line);border-radius:13px;padding:11px}.teacher-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:8px;font-size:12px;font-weight:800}.teacher-row button{margin-left:auto;border:0;border-radius:10px;background:var(--navy);color:#fff;padding:9px 13px}.empty{text-align:center;color:#8793a4;border:1px dashed #ccd4df;border-radius:20px;padding:28px}.hidden{display:none!important}@keyframes pulse{50%{transform:scale(1.06)}}@media(max-width:680px){.grid{grid-template-columns:1fr}.hero h2{font-size:27px}.hero{padding:23px}.meta{font-size:10px}.practice-title{font-size:25px}.wrap{padding-left:16px;padding-right:16px}}
</style></head><body><header><div class="wrap"><div><div class="eyebrow">Interview sprint</div><h1>English Speaking</h1></div><div class="switch"><button id="studentBtn" class="on">Student</button><button id="teacherBtn">Teacher</button></div></div></header><main id="app"></main><script>
const Q=[['Q001','HR','General','Tell me about yourself.'],['Q002','HR','General','Why are you interested in this position?'],['Q003','HR','General','What are your strengths?'],['Q004','Experience','Behavioral','Tell me about a difficult problem you solved.'],['Q005','Experience','Behavioral','Tell me about a time you worked under pressure.'],['Q006','Experience','Safety','Describe a situation where safety was especially important.'],['Q007','Technical','Transformer','What is the basic operating principle of a transformer?'],['Q008','Technical','Transformer','What are the common causes of transformer overheating?'],['Q009','Technical','Transformer','What is a Buchholz relay?'],['Q010','Technical','Transformer','How would you troubleshoot a transformer trip?'],['Q011','Technical','Protection','What is overcurrent protection?'],['Q012','Technical','Protection','What is earth fault protection?'],['Q013','Technical','Protection','How does differential protection work?'],['Q014','Technical','Protection','What is protection coordination?'],['Q015','Technical','Protection','Why is selectivity important in a protection system?'],['Q016','Technical','Electrical Safety','What is lockout/tagout?'],['Q017','Technical','Electrical Safety','How do you verify the absence of voltage?'],['Q018','Technical','Electrical Safety','Why is grounding important?'],['Q019','Technical','Electrical Safety','What precautions should be taken before electrical maintenance?'],['Q020','Technical','Electrical Safety','What is arc flash?']].map(x=>({id:x[0],category:x[1],topic:x[2],question:x[3]}));
const M=['未練習','不熟','普通','熟練','Interview Ready'];let role='student',cat='全部',topic='全部',mastery='全部',selected=null,attempts=[],rec=null,chunks=[],blob=null,sec=0,tick=null,ratings={mastery:2,technical:1,english:1};const app=document.querySelector('#app');
const dbp=new Promise((ok,no)=>{const r=indexedDB.open('english-speaking-trainer-v1',1);r.onupgradeneeded=()=>r.result.createObjectStore('attempts',{keyPath:'id'});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});async function all(){const d=await dbp;return new Promise((ok,no)=>{const r=d.transaction('attempts').objectStore('attempts').getAll();r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}async function put(x){const d=await dbp;return new Promise((ok,no)=>{const r=d.transaction('attempts','readwrite').objectStore('attempts').put(x);r.onsuccess=ok;r.onerror=()=>no(r.error)})}
const date=x=>x?new Date(x).toLocaleDateString('zh-TW'):'尚未練習',time=x=>String(Math.floor(x/60)).padStart(2,'0')+':'+String(x%60).padStart(2,'0'),esc=x=>String(x||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function stats(q){const a=(await all()).filter(x=>x.questionId===q.id).sort((a,b)=>b.createdAt-a.createdAt),last=a[0];return {...q,attempts:a.length,mastery:last?.mastery||0,last:last?.createdAt||0,retry:a.some(x=>x.retry)}}
async function home(){selected=null;const qs=await Promise.all(Q.map(stats)),filtered=qs.filter(q=>(cat==='全部'||q.category===cat)&&(topic==='全部'||q.topic===topic)&&(mastery==='全部'||q.mastery==mastery)).sort((a,b)=>b.retry-a.retry||a.mastery-b.mastery);app.innerHTML=`<div class="wrap"><section class="hero"><small>${role==='student'?'今天的練習':'Teacher View'}</small><h2>${role==='student'?'Speak clearly.<br>Think like an engineer.':'Listen. Guide.<br>Build confidence.'}</h2><p>${role==='student'?'選一題，開口練習 1–2 分鐘。':'查看錄音、留言並指定重新練習。'}</p></section><div class="filters">${['全部','HR','Experience','Technical'].map(x=>`<button class="chip ${cat===x?'on':''}" data-cat="${x}">${x==='Experience'?'經驗':x}</button>`).join('')}</div><div class="filters">${['全部','Transformer','Protection','Electrical Safety','Safety'].map(x=>`<button class="chip ${topic===x?'on':''}" data-topic="${x}">${x}</button>`).join('')}</div><select id="mastery"><option value="全部">全部熟練度</option>${M.map((x,i)=>`<option value="${i}" ${mastery==i?'selected':''}>${i} · ${x}</option>`).join('')}</select><div class="section-head"><div class="eyebrow">Question bank · ${filtered.length}</div><h2>${role==='student'?'優先練習':'學生題庫'}</h2></div><div class="grid">${filtered.map(q=>`<article class="card ${q.retry?'retry':''}">${q.retry?'<span class="retry-tag">★ 老師建議重新練習</span>':''}<p class="topic">⚡ ${q.topic}</p><h3 class="question">${q.question}</h3><div class="meta"><span>${M[q.mastery]}</span><span>🎙 ${q.attempts} 次</span><span>${date(q.last)}</span></div><div class="bars">${[1,2,3,4].map(n=>`<i class="${n<=q.mastery?'fill':''}"></i>`).join('')}</div><button class="primary" data-open="${q.id}">${role==='teacher'?'查看回答':'去練習'} →</button></article>`).join('')}</div></div>`;bindHome()}
function bindHome(){document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;home()});document.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>{topic=b.dataset.topic;home()});document.querySelector('#mastery').onchange=e=>{mastery=e.target.value;home()};document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openQ(b.dataset.open))}
async function openQ(id){selected=Q.find(q=>q.id===id);attempts=(await all()).filter(x=>x.questionId===id).sort((a,b)=>b.createdAt-a.createdAt);renderPractice()}
function rating(title,key,max,labels){return `<div class="rating"><h3>${title}</h3><div class="options">${Array.from({length:max+1},(_,n)=>`<button data-rate="${key}" data-value="${n}" class="${ratings[key]===n?'on':''}"><b>${n}</b>${labels[n]}</button>`).join('')}</div></div>`}
function renderPractice(){app.innerHTML=`<div class="wrap"><button class="back" id="back">← 返回題庫</button><div class="eyebrow">⚡ ${selected.topic}</div><h2 class="practice-title">${selected.question}</h2>${role==='student'?`<section class="recorder"><div class="mic ${rec?'live':''}">🎙</div><div class="timer">${time(sec)}</div><small>${rec?'Recording…':'準備好就開始回答'}</small>${!rec&&!blob?'<button class="record-btn" id="start">開始錄音</button>':''}${rec?'<button class="record-btn stop" id="stop">停止錄音</button>':''}${blob?`<audio controls id="preview"></audio><button class="record-btn stop" id="redo">重新錄製</button>`:''}</section>`:''}${role==='student'&&blob?`<section class="panel">${rating('熟練度','mastery',4,['未練習','不熟','普通','熟練','Ready'])}${rating('Technical Knowledge · 專業內容我知道嗎？','technical',2,['不知道','部分知道','知道'])}${rating('English Expression · 我能用英文表達嗎？','english',2,['講不出來','講得卡','可以'])}<button class="primary" id="save">儲存這次回答</button></section>`:''}<div class="section-head"><h2>練習紀錄 · ${attempts.length}</h2></div>${attempts.length?attempts.map((a,i)=>attemptHTML(a,attempts.length-i)).join(''):'<div class="empty">還沒有回答，從第一次開口開始。</div>'}</div>`;bindPractice()}
function attemptHTML(a,n){return `<article class="attempt"><div class="attempt-top"><div><b>Attempt #${n}</b><div class="eyebrow" style="margin-top:5px">${date(a.createdAt)} · ${time(a.duration)}</div></div><span class="pill">熟練度 ${a.mastery}</span></div><audio controls src="${URL.createObjectURL(a.audio)}"></audio><div class="meta" style="justify-content:flex-start"><span>Technical ${a.technical}/2</span><span>English ${a.english}/2</span></div>${a.comment&&role==='student'?`<div class="feedback"><b>老師回饋</b><p>${esc(a.comment)}</p>${a.retry?'<b>★ 建議重新練習</b>':''}</div>`:''}${role==='teacher'?`<div class="teacher-form"><textarea id="comment-${a.id}" placeholder="留下具體、可行的回饋…">${esc(a.comment)}</textarea><div class="teacher-row"><label>Teacher mastery <select id="tm-${a.id}">${[0,1,2,3,4].map(x=>`<option ${x==(a.teacherMastery??a.mastery)?'selected':''}>${x}</option>`).join('')}</select></label><label><input id="retry-${a.id}" type="checkbox" ${a.retry?'checked':''}> 建議重新練習</label><button data-feedback="${a.id}">儲存回饋</button></div></div>`:''}</article>`}
function bindPractice(){document.querySelector('#back').onclick=home;const s=document.querySelector('#start'),t=document.querySelector('#stop'),r=document.querySelector('#redo');if(s)s.onclick=startRec;if(t)t.onclick=stopRec;if(r)r.onclick=()=>{blob=null;sec=0;renderPractice()};if(blob){document.querySelector('#preview').src=URL.createObjectURL(blob)}document.querySelectorAll('[data-rate]').forEach(b=>b.onclick=()=>{ratings[b.dataset.rate]=+b.dataset.value;renderPractice()});const save=document.querySelector('#save');if(save)save.onclick=saveAttempt;document.querySelectorAll('[data-feedback]').forEach(b=>b.onclick=async()=>{const a=attempts.find(x=>x.id===b.dataset.feedback);a.comment=document.querySelector('#comment-'+a.id).value;a.teacherMastery=+document.querySelector('#tm-'+a.id).value;a.retry=document.querySelector('#retry-'+a.id).checked;await put(a);b.textContent='已儲存 ✓'})}
async function startRec(){try{if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)throw new Error('unsupported');const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});chunks=[];const mime=['audio/webm;codecs=opus','audio/webm','audio/mp4'].find(x=>MediaRecorder.isTypeSupported?.(x));rec=new MediaRecorder(stream,mime?{mimeType:mime}:undefined);rec.ondataavailable=e=>{if(e.data&&e.data.size>0)chunks.push(e.data)};rec.onerror=e=>{console.error('MediaRecorder error',e);alert('錄音發生錯誤，請保持頁面開啟並再試一次。')};rec.onstop=()=>{blob=new Blob(chunks,{type:rec.mimeType||mime||'audio/webm'});stream.getTracks().forEach(x=>x.stop());rec=null;clearInterval(tick);if(!blob.size)alert('這次沒有收到錄音資料，請重新錄製。');renderPractice()};rec.start(1000);sec=0;tick=setInterval(()=>{sec++;const el=document.querySelector('.timer');if(el)el.textContent=time(sec)},1000);renderPractice()}catch(e){console.error(e);alert(e.message==='unsupported'?'此瀏覽器不支援網頁錄音，請改用最新版 Chrome、Edge 或 Safari。':'請允許瀏覽器使用麥克風。若網站不是 HTTPS，瀏覽器可能會禁止錄音。')}}function stopRec(){const current=rec;if(!current||current.state==='inactive')return;try{current.requestData()}catch(e){}setTimeout(()=>{if(current.state!=='inactive')current.stop()},180)}
async function saveAttempt(){await put({id:crypto.randomUUID(),questionId:selected.id,createdAt:Date.now(),audio:blob,duration:sec,...ratings,comment:'',teacherMastery:null,retry:false});blob=null;sec=0;await openQ(selected.id)}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&rec?.state==='recording')console.warn('Recording continues while page is hidden; mobile browsers may pause it.')});window.addEventListener('beforeunload',e=>{if(rec?.state==='recording'){e.preventDefault();e.returnValue=''}});studentBtn.onclick=()=>{role='student';studentBtn.className='on';teacherBtn.className='';home()};teacherBtn.onclick=()=>{role='teacher';teacherBtn.className='on';studentBtn.className='';home()};home();
</script></body></html>
