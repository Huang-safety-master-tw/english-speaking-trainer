const DEFAULT_Q=[['Q001','HR','General','Tell me about yourself.'],['Q002','HR','General','Why are you interested in this position?'],['Q003','HR','General','What are your strengths?'],['Q004','Experience','Behavioral','Tell me about a difficult problem you solved.'],['Q005','Experience','Behavioral','Tell me about a time you worked under pressure.'],['Q006','Experience','Safety','Describe a situation where safety was especially important.'],['Q007','Technical','Transformer','What is the basic operating principle of a transformer?'],['Q008','Technical','Transformer','What are the common causes of transformer overheating?'],['Q009','Technical','Transformer','What is a Buchholz relay?'],['Q010','Technical','Transformer','How would you troubleshoot a transformer trip?'],['Q011','Technical','Protection','What is overcurrent protection?'],['Q012','Technical','Protection','What is earth fault protection?'],['Q013','Technical','Protection','How does differential protection work?'],['Q014','Technical','Protection','What is protection coordination?'],['Q015','Technical','Protection','Why is selectivity important in a protection system?'],['Q016','Technical','Electrical Safety','What is lockout/tagout?'],['Q017','Technical','Electrical Safety','How do you verify the absence of voltage?'],['Q018','Technical','Electrical Safety','Why is grounding important?'],['Q019','Technical','Electrical Safety','What precautions should be taken before electrical maintenance?'],['Q020','Technical','Electrical Safety','What is arc flash?']].map((x,i)=>({id:x[0],category:x[1],topic:x[2],question:x[3],sortOrder:i}));let Q=[];

async function all(){if(!currentUser)return[];const{data,error}=await sb.from('responses').select('*').order('created_at',{ascending:false});if(error)throw error;return Promise.all(data.map(async x=>{const{data:signed}=await sb.storage.from('recordings').createSignedUrl(x.audio_path,3600);return{id:x.id,questionId:x.question_id,createdAt:new Date(x.created_at).getTime(),audioUrl:signed?.signedUrl||'',audioPath:x.audio_path,duration:x.audio_duration,mastery:x.mastery,technical:x.technical_self_rating,english:x.english_self_rating,transcript:x.transcript||'',comment:x.teacher_comment,teacherMastery:x.teacher_mastery,retry:x.retry_required}}))}async function put(x){const{error}=await sb.from('responses').update({teacher_comment:x.comment,teacher_mastery:x.teacherMastery,retry_required:x.retry}).eq('id',x.id);if(error)throw error}
async function loadQuestions(){const{data,error}=await sb.from('questions').select('*').order('sort_order');if(error)throw error;if(!data.length&&userRole!=='teacher'){const rows=DEFAULT_Q.map(q=>({id:q.id,user_id:currentUser.id,category:q.category,topic:q.topic,question:q.question,tags:[q.category,q.topic].filter((x,i,a)=>x!=='General'&&a.indexOf(x)===i),sort_order:q.sortOrder}));const{error:seedError}=await sb.from('questions').insert(rows);if(seedError)throw seedError;Q=DEFAULT_Q.map(q=>({...q,tags:[q.category,q.topic].filter((x,i,a)=>x!=='General'&&a.indexOf(x)===i)}));return}Q=data.map(x=>({id:x.id,category:x.category,topic:x.topic,question:x.question,tags:(x.tags?.length?x.tags:[x.category,x.topic]).filter((v,i,a)=>v&&v!=='General'&&a.indexOf(v)===i),sortOrder:x.sort_order}))}
async function addQuestion(){const question=document.querySelector('#newQuestion').value.trim(),category=document.querySelector('#newCategory').value.trim()||'Technical',newTopic=document.querySelector('#newTopic').value.trim()||'General';if(!question){alert('請輸入英文題目。');return}const row={id:crypto.randomUUID(),user_id:currentUser.id,category,topic:newTopic,question,sort_order:Math.max(-1,...Q.map(q=>q.sortOrder))+1};const{error}=await sb.from('questions').insert(row);if(error){alert('新增失敗：'+error.message);return}await loadQuestions();home()}

function stats(q,records){const a=records.filter(x=>x.questionId===q.id).sort((a,b)=>b.createdAt-a.createdAt),last=a[0];return {...q,attempts:a.length,mastery:last?.mastery||0,last:last?.createdAt||0,retry:a.some(x=>x.retry)}}
async function home(){selected=null;app.innerHTML='<div class="wrap"><div class="empty" style="margin-top:40px">正在讀取雲端紀錄…</div></div>';try{const records=await all(),qs=Q.map(q=>stats(q,records)),filtered=qs.filter(q=>(cat==='全部'||q.category===cat)&&(topic==='全部'||q.topic===topic)&&(mastery==='全部'||q.mastery==mastery)).sort((a,b)=>b.retry-a.retry||a.mastery-b.mastery);app.innerHTML=`<div class="wrap"><section class="hero"><small>${role==='student'?'今天的練習':'Teacher View'}</small><h2>${role==='student'?'Speak clearly.<br>Think like an engineer.':'Listen. Guide.<br>Build confidence.'}</h2><p>${role==='student'?'選一題，開口練習 1–2 分鐘。':'查看錄音、留言並指定重新練習。'}</p></section><div class="filters">${['全部','HR','Experience','Technical'].map(x=>`<button class="chip ${cat===x?'on':''}" data-cat="${x}">${x==='Experience'?'經驗':x}</button>`).join('')}</div><div class="filters">${['全部','Transformer','Protection','Electrical Safety','Safety'].map(x=>`<button class="chip ${topic===x?'on':''}" data-topic="${x}">${x}</button>`).join('')}</div><select id="mastery"><option value="全部">全部熟練度</option>${M.map((x,i)=>`<option value="${i}" ${mastery==i?'selected':''}>${i} · ${x}</option>`).join('')}</select><div class="section-head"><div class="eyebrow">Question bank · ${filtered.length}</div><h2>${role==='student'?'優先練習':'學生題庫'}</h2></div><div class="grid">${filtered.map(q=>`<article class="card ${q.retry?'retry':''}">${q.retry?'<span class="retry-tag">★ 老師建議重新練習</span>':''}<p class="topic">⚡ ${q.topic}</p><h3 class="question">${q.question}</h3><div class="meta"><span>${M[q.mastery]}</span><span>🎙 ${q.attempts} 次</span><span>${date(q.last)}</span></div><div class="bars">${[1,2,3,4].map(n=>`<i class="${n<=q.mastery?'fill':''}"></i>`).join('')}</div><button class="primary" data-open="${q.id}">${role==='teacher'?'查看回答':'去練習'} →</button></article>`).join('')}</div></div>`;bindHome()}catch(e){console.error(e);app.innerHTML='<div class="wrap"><div class="feedback" style="margin-top:30px"><b>無法讀取雲端資料</b><p>'+es function bindHome(){document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;home()});document.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>{topic=b.dataset.topic;home()});document.querySelector('#mastery').onchange=e=>{mastery=e.target.value;home()};document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openQ(b.dataset.open))}
async function openQ(id){selected=Q.find(q=>q.id===id);attempts=(await all()).filter(x=>x.questionId===id).sort((a,b)=>b.createdAt-a.createdAt);let query=sb.from('question_notes').select('content').eq('question_id',id);if(userRole!=='teacher')query=query.eq('user_id',currentUser.id);const{data}=await query.limit(1).maybeSingle();questionNote=data?.content||'';noteVisible=false;renderPractice()}

function renderPractice(){app.innerHTML=`<div class="wrap"><button class="back" id="back">← 返回題庫</button><div class="eyebrow">⚡ ${selected.topic}</div><h2 class="practice-title">${selected.question}</h2>${role==='student'?`<section class="recorder"><div class="mic ${rec?'live':''}">🎙</div><div class="timer">${time(sec)}</div><small>${rec?'Recording…':'準備好就開始回答'}</small>${!rec&&!blob?'<button class="record-btn" id="start">開始錄音</button>':''}${rec?'<button class="record-btn stop" id="stop">停止錄音</button>':''}${blob?`<audio controls id="preview"></audio><button class="record-btn stop" id="redo">重新錄製</button>`:''}</section>`:''}${role==='student'&&blob?`<section class="panel">${rating('熟練度','mastery',4,['未練習','不熟','普通','熟練','Ready'])}${rating('Technical Knowledge · 專業內容我知道嗎？','technical',2,['不知道','部分知道','知道'])}${rating('English Expression · 我能用英文表達嗎？','english',2,['講不出來','講得卡','可以'])}<button class="primary" id="save">儲存這次回答</button></section>`:''}<div class="section-head"><h2>練習紀錄 · ${attempts.length}</h2></div>${attempts.length?attempts.map((a,i)=>attemptHTML(a,attempts.length-i)).join(''):'<div class="empty">還沒有回答，從第一次開口開始。</div>'}</div>`;bindPractice()}
function attemptHTML(a,n){return `<article class="attempt"><div class="attempt-top"><div><b>Attempt #${n}</b><div class="eyebrow" style="margin-top:5px">${date(a.createdAt)} · ${time(a.duration)}</div></div><span class="pill">熟練度 ${a.mastery}</span></div><audio controls src="${a.audioUrl}"></audio><div class="meta" style="justify-content:flex-start"><span>Technical ${a.technical}/2</span><span>English ${a.english}/2</span></div>${a.transcript?`<details style="margin-top:12px"><summary style="font-weight:800;cursor:pointer">Transcript</summary><div style="white-space:pre-wrap;margin-top:8px;color:var(--muted);font-size:13px">${esc(a.transcript)}</div></details>`:''}${a.comment&&role==='student'?`<div class="feedback"><b>老師回饋</b><p>${esc(a.comment)}</p>${a.retry?'<b>★ 建議重新練習</b>':''}</div>`:''}${role==='student'?`<button class="chip" data-delete="${a.id}" style="margin-top:14px;color:#b42318">刪除這次錄音</button>`:''}${role==='teacher'?`<div class="teacher-form"><textarea id="comment-${a.id}" placeholder="留下具體、可行的回饋…">${esc(a.comment)}</textarea><div class="teacher-row"><label>Teacher mastery <select id="tm-${a.id}">${[0,1,2,3,4].map(x=>`<option ${x==(a.teacherMastery??a.mastery)?'selected':''}>${x}</option>`).join('')}</select></label><label><input id="retry-${a.id}" type="checkbox" ${a.retry?'checked':''}> 建議重新練習</label><button data-feedback="${a.id}">儲存回饋</button></div></div>`:''}</article>`}
function enhancePractice(){const title=document.querySelector('.practice-title');if(!title)return;const panel=document.createElement('section');panel.className='panel';if(role==='student'){panel.innerHTML=`<button class="chip" id="toggleNote">${noteVisible?'隱藏我的講稿':'顯示我的講稿'}</button><div class="${noteVisible?'':'hidden'}" id="noteArea"><h3>我的回答講稿</h3><textarea id="scriptNote" placeholder="在這裡整理回答架構、關鍵字與完整講稿…">${esc(questionNote)}</textarea><button class="primary" id="saveNote">儲存講稿</button></div>`}else{panel.innerHTML=`<h3>Student's Answer Script</h3><div style="white-space:pre-wrap;color:var(--muted)">${esc(questionNote)||'No script has been added yet.'}</div>`}title.insertAdjacentElement('afterend',panel);const toggle=document.querySelector('#toggleNote');if(toggle)toggle.onclick=()=>{questionNote=document.querySelector('#scriptNote')?.value??questionNote;noteVisible=!noteVisible;renderPractice()};const saveNote=document.querySelector('#saveNote');if(saveNote)saveNote.onclick=async()=>{questionNote=document.querySelector('#scriptNote').value;const{error}=await sb.from('question_notes').upsert({user_id:currentUser.id,question_id:selected.id,content:questionNote,updated_at:new Date().toISOString()});if(error){alert('講稿儲存失敗：'+error.message);return}saveNote.textContent='已儲存 ✓'};if(rec){const live=document.createElement('div');live.id='liveTranscript';live.style='margin-top:14px;color:#c8d0dc;font-size:13px;text-align:left';live.textContent=transcriptDraft||'Live transcript will appear here…';document.querySelector('.recorder').appendChild(live)}if(blob&&role==='student'){const box=document.createElement('div');box.className='rating';box.innerHTML=`<h3>逐字稿（可手動修訂）</h3><textarea id="transcriptDraft" placeholder="Chrome 會嘗試在錄音時產生英文逐字稿；若未產生，可在這裡手動輸入。">${esc(transcriptDraft)}</textarea>`;document.querySelector('#save').parentElement.insertBefore(box,document.querySelector('#save').parentElement.firstChild);document.querySelector('#transcriptDraft').oninput=e=>transcriptDraft=e.target.value}}

async function saveDraggedOrder(grid){const ids=[...grid.querySelectorAll('.card [data-open]')].map(x=>x.dataset.open);Q.sort((a,b)=>ids.indexOf(a.id)-ids.indexOf(b.id));Q.forEach((q,i)=>q.sortOrder=i);const results=await Promise.all(Q.map((q,i)=>sb.from('questions').update({sort_order:i}).eq('id',q.id)));const failed=results.find(x=>x.error);if(failed)alert('題目順序儲存失敗：'+failed.error.message)}
function enableQuestionDragging(){if(role!=='student')return;const grid=document.querySelector('.grid');if(!grid||grid.dataset.dragReady)return;grid.dataset.dragReady='1';let dragging=null;grid.querySelectorAll('.card').forEach(card=>{card.querySelectorAll('[data-move]').forEach(x=>x.remove());card.draggable=true;card.style.cursor='grab';card.title='電腦直接拖曳；手機長按後拖曳';card.addEventListener('dragstart',e=>{if(e.target.closest('button,select,input,textarea,a,audio')){e.preventDefault();return}dragging=card;card.style.opacity='.45';card.style.cursor='grabbing'});card.addEventListener('dragend',async()=>{card.style.opacity='';card.style.cursor='grab';dragging=null;await saveDraggedOrder(grid)});card.addEventListener('dragover',e=>{e.preventDefault();if(!dragging||dragging===card)return;const box=card.getBoundingClientRect(),after=e.clientY>box.top+box.height/2;grid.insertBefore(dragging,after?card.nextSibling:card)});let holdTimer=null,touchActive=false;card.addEventListener('touchstart',e=>{if(e.target.closest('button,select,input,textarea,a,audio'))return;holdTimer=setTimeout(()=>{touchActive=true;dragging=card;card.style.opacity='.45';card.style.transform='scale(1.02)';card.style.zIndex='5';card.style.webkitUserSelect='none';navigator.vibrate?.(35)},280)},{passive:true});card.addEventListener('touchmove',e=>{if(!touchActive){clearTimeout(holdTimer);return}e.preventDefault();const touch=e.touches[0],target=document.elementFromPoint(touch.clientX,touch.clientY)?.closest('.grid .card');if(!target||target===card)return;const box=target.getBoundingClientRect(),after=touch.clientY>box.top+box.height/2;grid.insertBefore(card,after?target.nextSibling:target)},{passive:false});const finishTouch=async()=>{clearTimeout(holdTimer);if(!touchActive)return;touchActive=false;card.style.opacity='';card.style.transform='';card.style.zIndex='';card.style.webkitUserSelect='';dragging=null;await saveDraggedOrder(grid)};card.addEventListener('touchend',finishTouch);card.addEventListener('touchcancel',finishTouch);card.addEventListener('contextmenu',e=>{if(touchActive)e.preventDefault()})})}
function optimizePracticeLayout(){const recorder=document.querySelector('.recorder');if(recorder&&!recorder.dataset.compact){recorder.dataset.compact='1';const title=document.querySelector('.practice-title'),preview=recorder.querySelector('#preview');if(title&&title.nextElementSibling!==recorder)title.insertAdjacentElement('afterend',recorder);const mic=recorder.querySelector('.mic'),timer=recorder.querySelector('.timer'),hint=recorder.querySelector('small'),live=recorder.querySelector('#liveTranscript');if(mic)mic.style.display='none';if(timer)timer.style.display='none';if(hint)hint.style.display='none';if(live){recorder.insertAdjacentElement('afterend',live);live.style.margin='8px 0';live.style.padding='10px 13px';live.style.borderRadius='12px';live.style.background='#11243d';live.style.color='#fff'}recorder.style.position='sticky';recorder.style.top='78px';recorder.style.zIndex='8';if(preview){recorder.style.padding='10px 14px';recorder.style.maxWidth='680px';recorder.style.margin='0 auto';recorder.style.boxShadow='0 10px 30px #11243d44'}else{recorder.style.width='54px';recorder.style.height='54px';recorder.style.padding='0';recorder.style.margin='0 0 0 auto';recorder.style.background='transparent';recorder.style.boxShadow='none'}recorder.querySelectorAll('.record-btn').forEach(x=>{const label=x.id==='start'?'開始錄音':x.id==='stop'?'停止錄音':'重新錄製';x.textContent=x.id==='start'?'🎙':x.id==='stop'?'■':'↻';x.title=label;x.setAttribute('aria-label',label);x.style.width='50px';x.style.height='50px';x.style.minHeight='50px';x.style.margin='2px 0 0 auto';x.style.padding='0';x.style.borderRadius='50%';x.style.fontSize='22px';x.style.display='block'})}const note=document.querySelector('#scriptNote');if(note){note.style.minHeight='360px';note.style.fontSize='18px';note.style.lineHeight='1.7';note.style.padding='16px';note.style.resize='vertical'}const noteArea=document.querySelector('#noteArea');if(noteArea)noteArea.style.marginTop='14px'}
let questionCloudReady=false;new MutationObserver(()=>{if(currentUser&&!questionCloudReady&&document.querySelector('.hero')){questionCloudReady=true;loadQuestions().then(home).catch(e=>{questionCloudReady=false;alert('題庫讀取失敗：'+e.message)})}localizeTeacher();enhanceHome();enhanceTagMode();enableQuestionDragging();enhanceVocabularyEntry();optimizePracticeLayout()}).observe(document.body,{childList:true,subtree:true,characterData:true});
async function auth(signup){const email=document.querySelector('#authEmail').value.trim(),password=document.querySelector('#authPassword').value;if(!email||password.length<8){showLogin('請輸入 Email，密碼至少 8 個字元。');return}const result=signup?await sb.auth.signUp({email,password,options:{emailRedirectTo:location.origin+location.pathname}}):await sb.auth.signInWithPassword({email,password});if(result.error){showLogin(result.error.message);return}if(signup&&!result.data.session){showLogin('帳號已建立。請到信箱點擊驗證連結，再回來登入。');return}await init()}
async function init(){const{data:{session}}=await sb.auth.getSession();currentUser=session?.user||null;if(!currentUser){showLogin();return}const{data:profile}=await sb.from('profiles').select('*').eq('id',currentUser.id).maybeSingle();userRole=profile?.role||'student';if(userRole==='teacher'){const{data:studentProfile}=await sb.from('profiles').select('*').eq('role','student').limit(1).maybeSingle();learnerProfile=studentProfile||profile}else learnerProfile=profile;role=userRole==='teacher'?'teacher':'student';studentBtn.parentElement.parentElement.classList.remove('hidden');signoutBtn.classList.remove('hidden');teacherBtn.classList.remove('hidden');teacherBtn.textContent=userRole==='teacher'?'Teacher':'Teacher Preview';studentBtn.className=role==='student'?'on':'';teacherBtn.className=role==='teacher'?'on':'';home()}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&rec?.state==='recording')console.warn('Recording continues while page is hidden; mobile browsers may pause it.')});window.addEventListener('beforeunload',e=>{if(rec?.state==='recording'){e.preventDefault();e.returnValue=''}});studentBtn.onclick=()=>{role='student';document.documentElement.lang='zh-Hant';studentBtn.className='on';teacherBtn.className='';home()};teacherBtn.onclick=()=>{role=userRole==='teacher'?'teacher':'teacher-preview';teacherBtn.className='on';studentBtn.className='';home()};signoutBtn.onclick=async()=>{await sb.auth.signOut();currentUser=null;signoutBtn.classList.add('hidden');showLogin()};sb.auth.onAuthStateChange((event)=>{if(event==='SIGNED_OUT'){questionCloudReady=false;Q=[];showLogin()}});init();
